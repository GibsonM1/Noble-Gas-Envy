<body>
<header class="md-top-app-bar top" id="top"></header>
<main id="main"></main>
<dialog id="dlg" class="md-dialog"></dialog>
<div id="snack" class="md-snackbar" role="status" aria-live="polite"></div>

<script>
/* ================= CONFIG (teacher settings) ================= */
const CONFIG = {
  CARDS_TO_MAKE: 6,          // how many cards the student makes alone (1–20). 20 = whole set and skips the team check
  CARD_ORDER: [11,8,12,6,17,18,13,15,16,9,7,3,19,20,4,14,5,10,1,2], // which cards the student gets, first ones first (default: Na, O, Mg, C, Cl, Ar)
  TEAM_MISTAKES: 3,          // how many tablemate cards have a planted mistake to find and fix (0 = skip the team check)
  ASK_NEUTRONS: false,       // true = student calculates n⁰ like the paper card; false = neutrons are filled in for them
  HIGHLIGHT_COUNTER_CARDS: 2, // highlight the unmatched particles in the counter for this many cards (0 = never, 99 = always)
  FADE_COUNTER_AFTER: 3,     // hide the p+/e- counter after this many cards with a first-try correct charge (0 = never hide)
  FILL_SHORTCUT_AFTER: 1,    // unlock the "Fill inner energy levels" button after this many finished cards (0 = always on, 99 = never)
  WRONG_TRIES_BEFORE_ANSWER: 2, // wrong tries before the answer is shown
  INCLUDE_EXTENSION: true,   // include the antimony question and the "same electrons as S2-" question
  SOUND_DEFAULT: false,      // sound on for a student's first visit
  VERSION: 'Nov 8, 2026, update 5',
};
/* ============================================================== */

const KEY='ngenvy-progress', SKEY='ngenvy-sound';
const EL=[null,['H','Hydrogen',1.008],['He','Helium',4.003],['Li','Lithium',6.94],['Be','Beryllium',9.012],['B','Boron',10.81],['C','Carbon',12.01],['N','Nitrogen',14.01],['O','Oxygen',16.00],['F','Fluorine',19.00],['Ne','Neon',20.18],['Na','Sodium',22.99],['Mg','Magnesium',24.31],['Al','Aluminum',26.98],['Si','Silicon',28.09],['P','Phosphorus',30.97],['S','Sulfur',32.06],['Cl','Chlorine',35.45],['Ar','Argon',39.95],['K','Potassium',39.10],['Ca','Calcium',40.08]];
const sym=z=>EL[z][0], nm=z=>EL[z][1], nn=z=>Math.round(EL[z][2])-z;
const CAPS=[2,8,8,8], R=[32.5,47,62,77], KINDS=['tri','dash','star','sq'], CX=105, CY=121, RN=23.5;
const ORDER8=[0,2,4,6,1,3,5,7], ORDER2=[0,1];
const MINUS='−';
const NG={0:'',2:'helium',10:'neon',18:'argon'};
const GROUP=z=>z==1?1:z==2?8:z<=10?z-2:z<=18?z-10:z-18;
const PERIOD=z=>z<=2?1:z<=10?2:z<=18?3:4;
const CHOICES=[['loses','loses'],['gains','gains'],['shares','shares'],['nochange','no change']];
const REASONS=[['count','Wrong number of e⁻ moved'],['least','Not the least change'],['share','Should share (no ion)'],['mag','Charge number is wrong'],['sign','Charge sign (+/−) is wrong'],['order','Number and sign in wrong order']];
const REASON_OK={count:['count','mag'],least:['least'],share:['share'],mag:['mag'],sign:['sign'],order:['order']};
const ERR_POOL=[
 {z:15,type:'mag',choice:'gains',n:3,q:-1},
 {z:16,type:'sign',choice:'gains',n:2,q:2},
 {z:20,type:'order',choice:'loses',n:2,raw:'+2'},
 {z:14,type:'share',choice:'loses',n:4,q:4},
 {z:3,type:'least',choice:'gains',n:7,q:-7},
 {z:12,type:'count',choice:'loses',n:1,q:1},
 {z:7,type:'sign',choice:'gains',n:3,q:3},
 {z:9,type:'mag',choice:'gains',n:1,q:-2},
 {z:4,type:'least',choice:'gains',n:6,q:-6},
 {z:19,type:'order',choice:'loses',n:1,raw:'+1'},
];

function config(z){let r=z;return CAPS.map(c=>{const k=Math.min(c,r);r-=k;return k})}
function vIdx(z){const c=config(z);let i=0;c.forEach((k,j)=>{if(k>0)i=j});return i}
function answer(z){const c=config(z),vi=vIdx(z),v=c[vi],cap=CAPS[vi];
  if(v==cap)return{choice:'nochange',n:0,net:0,v,cap,vi};
  if(z==1)return{choice:'loses',n:1,net:1,v,cap,vi};
  const lose=v,gain=cap-v;
  if(lose<gain)return{choice:'loses',n:v,net:v,v,cap,vi};
  if(gain<lose)return{choice:'gains',n:gain,net:-gain,v,cap,vi};
  return{choice:'shares',n:4,net:0,v,cap,vi};}
function emptySeats(){return CAPS.map(k=>Array(k).fill(0))}
function fillOrder(ri){return CAPS[ri]==2?ORDER2:ORDER8}
function neutralSeats(z){const s=emptySeats(),c=config(z);c.forEach((k,ri)=>{fillOrder(ri).slice(0,k).forEach(i=>s[ri][i]=1)});return s}
function applyMoves(s,z,choice,n){const vi=vIdx(z);if(choice=='loses'){const ord=fillOrder(vi).filter(i=>s[vi][i]==1).reverse();ord.slice(0,n).forEach(i=>s[vi][i]=2)}
  if(choice=='gains'){let ri=vi;let left=n;while(left>0&&ri<4){fillOrder(ri).forEach(i=>{if(left>0&&s[ri][i]==0){s[ri][i]=3;left--}});ri++}}return s}
const eCount=s=>s.flat().filter(v=>v==1||v==3).length;
const moves=s=>s.flat().filter(v=>v==2||v==3).length;

function ringMarks(ri){const r=R[ri],k=KINDS[ri],C=2*Math.PI*r;
  if(k=='dash'){const n=Math.floor(C/7.5),seg=C/n;return `<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="${(seg*.55).toFixed(2)} ${(seg*.45).toFixed(2)}"/>`}
  const sp={tri:5.8,star:8,sq:5.8}[k],n=Math.floor(C/sp);let d='';
  for(let j=0;j<n;j++){const t=j/n*2*Math.PI+.05,x=CX+r*Math.cos(t),y=CY-r*Math.sin(t);
    if(k=='tri')d+=`M${(x).toFixed(1)},${(y-1.7).toFixed(1)}l1.5,2.7h-3z`;
    else if(k=='sq')d+=`M${(x-1).toFixed(1)},${(y-1).toFixed(1)}h2v2h-2z`;
    else{for(let q=0;q<10;q++){const a=-Math.PI/2+q*Math.PI/5,rr=q%2?1:2.4;d+=(q?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1)}d+='z'}}
  return `<path d="${d}" fill="#7a7a7a"/>`}
const MARKS=[0,1,2,3].map(ringMarks).join('');
function seatAng(ri){const r=R[ri],k=CAPS[ri],off=(6.2/r)*180/Math.PI;if(k==2)return[90,270];const rot=(ri==1||ri==3)?45:0,o=[];for(const a of[90,0,270,180])for(const d of[-off,off])o.push(a+rot+d);return o}
const SEATPOS=CAPS.map((k,ri)=>seatAng(ri).map(a=>{const t=a*Math.PI/180;return{x:CX+R[ri]*Math.cos(t),y:CY-R[ri]*Math.sin(t),ux:Math.cos(t),uy:-Math.sin(t)}}));
const DOTS=(()=>{let s='';for(let q=0;q<10;q++){const t=q/10*2*Math.PI;s+=`<circle cx="${(5.2*Math.cos(t)).toFixed(2)}" cy="${(5.2*Math.sin(t)).toFixed(2)}" r=".62" fill="#444"/>`}return s})();
function moveArrow(P,inward){const cl=(v,a,b)=>Math.max(a,Math.min(b,v));const side=P.ux>=0?1:-1,ex=side>0?204:6,ey=cl(P.y+P.uy*22,50,186);
  const cx=cl(P.x+P.ux*26,4,206),cy=cl(P.y+P.uy*26,42,190);
  const a=[P.x+P.ux*(inward?8.5:7.5),P.y+P.uy*(inward?8.5:7.5)],b=[ex,ey];const [s0,e0]=inward?[b,a]:[a,b];
  const ang=Math.atan2(e0[1]-cy,e0[0]-cx),h=4.5,f=n=>n.toFixed(1);
  return `<path d="M${f(s0[0])},${f(s0[1])}Q${f(cx)},${f(cy)} ${f(e0[0])},${f(e0[1])}M${f(e0[0]-h*Math.cos(ang-.5))},${f(e0[1]-h*Math.sin(ang-.5))}L${f(e0[0])},${f(e0[1])}L${f(e0[0]-h*Math.cos(ang+.5))},${f(e0[1]-h*Math.sin(ang+.5))}" stroke="#6a3fb5" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`}
const WORDX={loses:14,gains:55,shares:97,nochange:142},WORDW={loses:25,gains:25,shares:29,nochange:52};

function cardSVG(c){const z=c.z;let s=`<svg viewBox="0 0 210 263" role="img" aria-label="Ion card ${z}, ${nm(z)}" font-family="Atkinson Hyperlegible, system-ui, sans-serif">

    s+=`<g transform="translate(${P.x.toFixed(2)},${P.y.toFixed(2)})"${c.interactive?` class="seat" role="button" tabindex="0" data-act="seat" data-r="${ri}" data-i="${i}" data-fk="s${ri}-${i}" aria-label="Energy level ${ri+1}, seat ${i+1}: ${st}"`:''}>

    if(v==3)s+=moveArrow(P,true);
  }));
  const SC=1.25,WX={...WORDX};if(c.final&&c.choice){const ws=CHOICES.map(([k])=>WORDW[k]*(k==c.choice?SC:1)),g=(194-ws.reduce((a,b)=>a+b,0))/3;let x=8;CHOICES.forEach(([k],i)=>{WX[k]=x;x+=ws[i]+g})}
  for(const[k,lab]of CHOICES){const win=c.final&&c.choice==k,out=(c.final&&c.choice!=k)||(c.ruled||[]).includes(k)&&c.choice!=k,sc=win?SC:1,w=WORDW[k]*sc,x=WX[k];

  if(c.shareText){s+=`<text x="105" y="236" text-anchor="middle" font-size="11.5" fill="#222">Shares 4 e⁻ in covalent bonds.</text><text x="105" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#222">Does not form an ion.</text>`}
  else{s+=`<g opacity="${c.ghost?.2:1}"><line x1="12" y1="252" x2="42" y2="252" stroke="#000" stroke-width=".8"/>

<text x="44" y="248" dominant-baseline="central" font-size="13" fill="#000">e⁻</text>
<text x="70" y="248" dominant-baseline="central" font-size="13" fill="#000">becomes</text>
<path d="M136,260H170V239.5H191V222.5H165V229H136Z" fill="none" stroke="#000" stroke-width=".9" stroke-dasharray="2.8 2.1"/></g>`;
  if(c.hlBox)s+=`<ellipse cx="178" cy="231" rx="19" ry="14" fill="#FFEB3B" opacity=".6"/><ellipse cx="178" cy="231" rx="19" ry="14" fill="none" stroke="#F9A825" stroke-width="2.4"/>`;
  if(c.ion){const i=c.ion,t=i.raw||qSup(i.q),sg=i.raw?(i.raw[0]=='+'?1:-1):Math.sign(i.q||0),col=sg>0?'#C2185B':sg<0?'#1565C0':'#222';

/* ---------- tally (p+ / e- counter) ---------- */
function tallyHTML(p,e,opts={}){const m=Math.max(p,e),lo=Math.min(p,e),hl=!!opts.hl;let pr='',er='';
  const tok=(cls,g)=>`<span class="tok ${cls}" aria-hidden="true">${g}</span>`,gap='<span class="tok gap" aria-hidden="true"></span>';
  for(let i=0;i<lo;i++){pr+=tok('p','+');er+=tok('e',MINUS)}
  let pu='',eu='';for(let i=lo;i<m;i++){pu+=i<p?tok('p un','+'):gap;eu+=i<e?tok('e un',MINUS):gap}
  if(m>lo){if(hl){pr+=p>e?`<span class="hlgrp">${pu}</span>`:pu;er+=e>p?`<span class="hlgrp">${eu}</span>`:eu}else{pr+=pu;er+=eu}}
  const d=p-e;const txt=d>0?`${d} proton${d>1?'s have':' has'} no electron partner.`:d<0?`${-d} electron${-d>1?'s have':' has'} no proton partner.`:'Every proton has an electron partner.';
  return `<div class="box tally" aria-label="Counter: ${p} protons, ${e} electrons. ${txt}">
  <div class="thead"><h3>Counter</h3>${opts.hideBtn?`<button class="md-btn text" data-act="hideTally">Hide</button>`:''}</div>
  <div class="trow"><span class="lab">p⁺</span>${pr}<span class="small" style="margin-left:8px">${p}</span></div>
  <div class="trow"><span class="lab">e⁻</span>${er}<span class="small" style="margin-left:8px">${e}</span></div>
  <div class="small">${txt} <span aria-hidden="true">${hl&&p!=e?'The <mark class="hlmk">highlighted</mark> particles make the charge.':'(Outlined = no partner)'}</span></div></div>`}

/* ---------- analysis ---------- */
function qList(){const q=['pat','lost','gained','identity','ms'];if(CONFIG.INCLUDE_EXTENSION)q.push('sb','same');return q}
const STARTERS={pat:'All atoms in group ___ ___ ___ e⁻ and become ___.  ·  Atoms that ___ electrons become ___.',lost:'When an atom loses electrons, its charge becomes ___ because ___.',gained:'When an atom gains electrons, its charge becomes ___ because ___.',identity:'Gaining or losing electrons ___ change the element, because the element’s identity depends on the number of ___.',ms:'I think it is called Noble Gas Envy because ___.'};
function qDone(k){const a=S.ans;if(k=='pat')return a.pat.every(t=>words(t)>=3);if(k=='sb')return a.sb.ok||a.sb.tries>CONFIG.WRONG_TRIES_BEFORE_ANSWER?words(a.sbx)>=3:false;if(k=='same')return a.same.ok||a.same.tries>CONFIG.WRONG_TRIES_BEFORE_ANSWER;return words(a[k])>=3}
function renderAnalysis(){const qs=qList(),k=qs[S.aq],a=S.ans;
  const chips=`<div class="qchips">${qs.map((q,i)=>{const ok=i<S.aq||qDone(q);const reach=i<=S.aq||qs.slice(0,i).every(qDone);return `<button class="cc ${i==S.aq?'cur':ok?'dn':reach?'':'lk'}" ${reach?`data-act="aq" data-i="${i}"`:'disabled'} aria-label="Question ${i+1}">${ok&&i!=S.aq?IC.check.replace('<svg','<svg width="14" height="14"'):''}${i+1}</button>`}).join('')}</div>`;
  const st=STARTERS[k]?`<details><summary class="small" style="cursor:pointer">Need a starter?</summary><p class="starter" style="margin:6px 0 0">${STARTERS[k]}</p></details>`:'';
  let q='';
  if(k=='pat')q=`<h2>1. List at least three patterns you notice in the cards.</h2><p class="lead">Look across rows and down columns. What do cards in the same column have in common?</p>${[0,1,2].map(i=>`<label class="f" style="align-items:flex-start">${'abc'[i]}.<textarea class="md-textarea" data-fld="pat${i}" data-fk="pat${i}">${esc(a.pat[i])}</textarea></label>`).join('')}${st}`;
  if(k=='lost')q=`<h2>2. What happens to the charge on an atom when electrons are lost?</h2><textarea class="md-textarea" data-fld="lost" data-fk="lost">${esc(a.lost)}</textarea>${st}`;
  if(k=='gained')q=`<h2>3. What happens to the charge on an atom that gains electrons?</h2><textarea class="md-textarea" data-fld="gained" data-fk="gained">${esc(a.gained)}</textarea>${st}`;
  if(k=='identity')q=`<h2>4. Does gaining or losing an electron change the element’s identity (name)? Explain why or why not.</h2><p class="lead">Think back to nuclear decay. What changed the element then?</p><textarea class="md-textarea" data-fld="identity" data-fk="identity">${esc(a.identity)}</textarea>${st}`;
  if(k=='ms')q=`<h2>5. Making Sense: Why do you think this lesson is called “Noble Gas Envy”?</h2><textarea class="md-textarea" data-fld="ms" data-fk="ms">${esc(a.ms)}</textarea>${st}`;
  if(k=='sb'){const s=a.sb,lim=CONFIG.WRONG_TRIES_BEFORE_ANSWER,dis=s.ok||s.tries>lim?'disabled':'';
   q=`<h2>6. Sb, antimony, gains three electrons.</h2><p style="margin:0">Write the symbol for an antimony atom that has gained three electrons:</p>
   ${qTiles(s.q,'sbQ','',dis)}<div class="row"><b style="font-size:28px">${s.q==null?'Sb':fmtIon('Sb',s.q)}</b>
   ${s.ok||s.tries>lim?'':`<button class="md-btn tonal" data-act="sbCheck">Check</button>`}</div>
   ${s.ok?msgHTML({kind:'good',html:'Sb<sup>3−</sup>. Three extra electrons make it 3−.'}):s.tries>lim?msgHTML({kind:'info',html:'The answer is Sb<sup>3−</sup>: 3 extra electrons, so 3 more electrons than protons.'}):s.tries?msgHTML({kind:'hint',html:'Gaining electrons adds negative charges. How many extra electrons does antimony have?'}):''}
   ${s.ok||s.tries>lim?`<p style="margin:8px 0 0">Does antimony resemble a noble gas after gaining three electrons? Explain.</p><textarea class="md-textarea" data-fld="sbx" data-fk="sbx">${esc(a.sbx)}</textarea><p class="small" style="margin:0">Hint: find Sb on your periodic table. Which noble gas is closest?</p>`:''}`}
  if(k=='same'){const s=a.same,lim=CONFIG.WRONG_TRIES_BEFORE_ANSWER,opts=[['Cl','Cl<sup>−</sup>'],['Ca','Ca<sup>2+</sup>'],['Na','Na<sup>+</sup>'],['O','O<sup>2−</sup>'],['P','P<sup>3−</sup>']],fin=s.ok||s.tries>lim;
   q=`<h2>7. Choose all the ions that have the same number of electrons as S<sup>2−</sup>.</h2><div class="row">${opts.map(([k,h])=>`<button class="chip ${s.sel.includes(k)?'on':''}" data-act="sameSel" data-v="${k}" aria-pressed="${s.sel.includes(k)}" ${fin?'disabled':''} style="font-size:20px">${h}</button>`).join('')}</div>
   ${fin?'':`<div class="row"><button class="md-btn tonal" data-act="sameCheck">Check</button></div>`}
   ${s.ok?msgHTML({kind:'good',html:'Cl<sup>−</sup>, Ca<sup>2+</sup>, and P<sup>3−</sup> all have 18 electrons, like S<sup>2−</sup> and argon.'}):s.tries>lim?msgHTML({kind:'info',html:'S<sup>2−</sup> has 16 + 2 = 18 electrons. Cl<sup>−</sup> (17 + 1), Ca<sup>2+</sup> (20 − 2), and P<sup>3−</sup> (15 + 3) also have 18. Na<sup>+</sup> and O<sup>2−</sup> have 10.'}):s.tries?msgHTML({kind:'hint',html:'S<sup>2−</sup> has 16 + 2 = 18 electrons. Count the electrons in each ion: protons, then add or subtract the charge.'}):''}`}
  const last=S.aq==qs.length-1;
  return `<div class="split"><div class="l">${ptHTML('analysis',{sb:k=='sb'})}</div><div class="r">${chips}${q}<div class="row"><button class="md-btn outlined" data-act="aqPrev" ${S.aq?'':'disabled'}>Back</button><button class="md-btn filled" data-act="aqNext" ${qDone(k)?'':'disabled'}>${last?'Review my work':'Next'}</button>${qDone(k)?'':`<span class="small">${k=='pat'?'Write at least 3 words in each box.':k=='sb'||k=='same'?'Check your answer first.':'Write at least 3 words.'}</span>`}</div></div></div>`}
Object.assign(A,{
 aq(el){S.aq=+el.dataset.i},aqPrev(){S.aq=Math.max(0,S.aq-1)},
 aqNext(){if(S.aq<qList().length-1)S.aq++;else{S.phase='review';S.reached.review=1}},
 sbQ(el){S.ans.sb.q=+el.dataset.v},
 sbCheck(){const s=S.ans.sb;if(s.q==-3){s.ok=true;beep('good')}else{s.tries++;beep('bad')}},
 sameSel(el){const s=S.ans.same,v=el.dataset.v;s.sel=s.sel.includes(v)?s.sel.filter(x=>x!=v):[...s.sel,v]},
 sameCheck(){const s=S.ans.same;const ok=['Cl','Ca','P'].every(x=>s.sel.includes(x))&&s.sel.length==3;if(ok){s.ok=true;beep('good')}else{s.tries++;beep('bad')}},
});

/* ---------- review / finish ---------- */
function cardRows(){return S.my.map(z=>{const c=S.cards[z];if(!c||c.ph!='done')return{z,txt:'not finished',first:false};const net=z-eCount(c.seats);const t=c.tries;const first=t.build==0&&t.envy==0&&t.ion==0;return{z,html:netHTML(z,net),txt:ionTxt(netHTML(z,net)),vb:vbText(c.choice,c.choice=='shares'?4:c.choice=='nochange'?0:moves(c.seats)),first,hints:t.nuc+t.build+t.envy+t.ion}})}
function answerList(){const a=S.ans,L=[['1. Patterns',a.pat.map((t,i)=>'abc'[i]+'. '+t).join('\n')],['2. Charge when electrons are lost',a.lost],['3. Charge when electrons are gained',a.gained],['4. Does it change the element?',a.identity],['5. Why “Noble Gas Envy”?',a.ms]];
  if(CONFIG.INCLUDE_EXTENSION){L.push(['6. Antimony gains 3 e⁻',(a.sb.ok?'Sb³⁻ (correct)':'Sb³⁻ (shown after '+a.sb.tries+' tries)')+'\n'+a.sbx]);L.push(['7. Same electrons as S²⁻',(a.same.sel.join(', ')||'none')+(a.same.ok?' (correct)':' (answer shown)')])}return L}
function copyText(){const rows=cardRows();let t=`Noble Gas Envy Card Lab (make-up)\nName: ${S.name}   Period: ${S.period}\nFinished: ${new Date(S.finished||Date.now()).toLocaleString()}\n\nMY CARDS\n`;
  rows.forEach(r=>t+=`${r.z} ${nm(r.z)}: ${r.vb||''} → ${r.txt}${r.first?' (first try)':` (${r.hints} hints)`}\n`);
  if(S.team)t+=`\nTEAM CHECK: fixed ${Object.keys(S.team.fixed).length} of ${S.team.errs.length} mistakes (${S.team.errs.map(z=>nm(z)).join(', ')}); false alarms: ${S.team.fa}\n`;
  t+='\nPATTERNS & ANALYSIS\n';answerList().forEach(([q,a])=>t+=`${q}\n${a}\n\n`);return t}
function renderReview(){const rows=cardRows(),fin=S.phase=='finished';const ft=rows.filter(r=>r.first).length;
  return `<div class="center" style="max-width:900px">${fin?`<div class="msg good" style="font-size:20px"><b class="tag">Finished!</b><span>${esc(S.name)}, Period ${esc(S.period)} · ${new Date(S.finished).toLocaleString()}</span></div>
  <p style="margin:0;font-size:18px"><b>Next:</b> 1) Press <b>Copy my answers</b> and paste them into the assignment in Google Classroom. 2) Show this screen to Mr. Gibson.</p>`:`<h2>Review your work</h2><p class="lead">Check your answers. Click <b>Edit</b> to change one. Then press <b>I'm finished</b>.</p>`}
  <div class="box"><h3>My cards: ${ft} of ${rows.length} right on the first try</h3><table class="sum"><tr><th>Card</th><th>Change</th><th>Ion</th><th>First try?</th></tr>${rows.map(r=>`<tr><td>${r.z} ${nm(r.z)}</td><td>${r.vb||''}</td><td><b>${r.html||r.txt}</b></td><td>${r.first?'yes':'no ('+r.hints+' hints)'}</td></tr>`).join('')}</table>
  ${S.team?`<p style="margin:8px 0 0">Team check: fixed <b>${Object.keys(S.team.fixed).length} of ${S.team.errs.length}</b> mistakes · false alarms: ${S.team.fa}</p>`:''}</div>
  <dl class="review box" style="margin:0">${answerList().map(([q,a],i)=>`<dt>${q} ${fin?'':`<button class="md-btn text" data-act="edit" data-i="${i}">Edit</button>`}</dt><dd>${esc(a)}</dd>`).join('')}</dl>
  <div class="row"><button class="md-btn ${fin?'filled':'tonal'}" data-act="copy">Copy my answers</button>${fin?'':`<button class="md-btn filled" data-act="finish">I'm finished</button>`}</div>
  <textarea class="md-textarea" id="copyBox" aria-label="Your answers as text" style="min-height:120px;${fin?'':'display:none'}" readonly>${esc(copyText())}</textarea></div>`}
Object.assign(A,{
 edit(el){S.phase='analysis';S.aq=+el.dataset.i},
 finish(){S.finished=S.finished||Date.now();S.phase='finished';beep('good')},
 copy(){const t=copyText(),box=document.getElementById('copyBox');if(box){box.style.display='';box.value=t}
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>snack('Copied! Paste it into Google Classroom.')).catch(()=>{if(box){box.select();try{document.execCommand('copy');snack('Copied! Paste it into Google Classroom.')}catch(e){snack('Select the text below and copy it.')}}})},
});

/* ---------- start / nav / help ---------- */
Object.assign(A,{
 start(){const n=document.getElementById('nmIn').value.trim(),p=document.getElementById('perIn').value;if(!n){snack('Type your name first.');document.getElementById('nmIn').focus();return}
  S.name=n;S.period=p;if(!S.my.length){S.my=CONFIG.CARD_ORDER.slice(0,Math.max(1,Math.min(20,CONFIG.CARDS_TO_MAKE)));S.started=Date.now()}
  if(S.phase=='start')S.phase=S.finished?'finished':S.lastPhase||'cards'},
 restart(){openDlg(`<div class="dlg"><h2>Start over?</h2><p>This erases all your cards and answers on this device.</p><div class="row"><button class="md-btn outlined" data-act="closeDlg">Cancel</button><button class="md-btn filled" data-act="reallyRestart">Start over</button></div></div>`)},
 reallyRestart(){document.getElementById('dlg').close();const n=S.name,p=S.period;S=fresh();S.name=n;S.period=p},
 go(el){const to=el.dataset.to;if(to=='review'&&S.phase=='finished')return;S.phase=to},
 sound(){SOUND=!SOUND;try{localStorage.setItem(SKEY,SOUND?'1':'0')}catch(e){}snack('Sound '+(SOUND?'on':'off'));beep('tap')},
 help(){openDlg(`<div class="dlg" style="max-width:640px"><h2>How Card Lab works</h2>
  <p><b>Same as the paper cards.</b> A shaded seat is an electron. A lost electron gets an <b>X and an arrow out</b>. A gained electron gets a <b>filled seat and an arrow in</b>. Each energy level has its own marks (triangles, dashes, stars, squares).</p>
  <p><b>The counter</b> pairs each proton (+) with an electron (−). Particles with no partner are outlined. They tell you the charge.</p>
  <p><b>Keyboard:</b> Tab to a seat, then press Enter or Space.</p>
  <p class="small">Your work saves on this device. Version: ${CONFIG.VERSION}</p>
  <div class="row"><button class="md-btn filled" data-act="closeDlg">Got it</button></div></div>`)},
});

/* ---------- render + events ---------- */
function render(){S.lastPhase=S.phase=='start'?S.lastPhase:S.phase;save();renderTop();const m=document.getElementById('main');
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  if(S.phase=='start'){m.innerHTML=renderStart();m.style.overflow='auto'}
  else if(S.phase=='cards'){m.innerHTML=renderCards();m.style.overflow='hidden'}
  else if(S.phase=='team'){initTeam();m.innerHTML=renderTeam();m.style.overflow='auto'}
  else if(S.phase=='analysis'){m.innerHTML=renderAnalysis();m.style.overflow='hidden'}
  else{m.innerHTML=renderReview();m.style.overflow='auto'}
  const d=document.getElementById('dlg');if(d.open&&S.team&&S.team.open)d.innerHTML=inspectorHTML(S.team.open);
  if(fk){const el=document.querySelector(`[data-fk="${fk}"]`);if(el){el.focus();if(el.setSelectionRange&&el.value!=null&&el.type!='number'){try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}}}
function startPhaseBack(){if(S.phase!='start'){S.lastPhase=S.phase}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(!f)return;
  if(CLEARS.has(el.dataset.act)&&S.phase=='cards'){const c=curCard();if(c.msg&&c.msg.kind!='good')c.msg=null}
  if(S.team&&S.team.open&&/^fx|^reason/.test(el.dataset.act)){const fx=S.team.fix[S.team.open];if(fx)fx.msg=null}
  if(el.dataset.act=='reason'){f(el);render();return}f(el);render()});
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('.seat');if(el&&(e.key=='Enter'||e.key==' ')){e.preventDefault();const c=curCard();if(c.msg&&c.msg.kind!='good')c.msg=null;A.seat(el);render()}
  if(e.key=='Enter'&&e.target.id=='nmIn'){A.start();render()}
  if(e.key=='Enter'&&(e.target.id=='pIn'||e.target.id=='nIn')&&S.phase=='cards'){e.preventDefault();A.checkNuc();render()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id=='pIn'){curCard().p=t.value;save();return}
  if(t.id=='nIn'){curCard().n=t.value;save();return}
  if(t.id=='nmIn'){S.name=t.value;return}
  const f=t.dataset&&t.dataset.fld;if(f){if(f.startsWith('pat'))S.ans.pat[+f.slice(3)]=t.value;else S.ans[f]=t.value;save();
    const k=qList()[S.aq];const btn=document.querySelector('[data-act="aqNext"]');if(btn){const ok=qDone(k);if(btn.disabled==ok){render()}}}});
document.addEventListener('change',e=>{if(e.target.id=='perIn')S.period=e.target.value});
document.getElementById('dlg').addEventListener('close',()=>{if(S.team){S.team.open=null;S.team.dnote=null}render()});
render();
</script>
